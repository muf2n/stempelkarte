<!doctype html>
<!-- Rückkehr von der Bank-Anmeldung (Enable Banking → BAWAG): code/state an den eigenen Server schicken, dann zurück zu Alltag › Geld. -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <!-- M3: Content-Security-Policy (nur was die App braucht: Firebase/Google, Leaflet lokal unter vendor/ mit SRI, Kacheln OSM + Ersatz CARTO, OSM-Kacheln/Nominatim/OSRM, eigener Worker). Kein 'unsafe-eval', keine Inline-Skripte. Neue externe Adresse? Hier ergänzen. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://*.googleusercontent.com https://www.gstatic.com; media-src 'self' data: blob:; connect-src 'self' data: blob: https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://apis.google.com https://stempelkarte-mcp.lippa-florian.workers.dev https://nominatim.openstreetmap.org https://router.project-osrm.org https://routing.openstreetmap.de https://api.open-meteo.com; frame-src https://accounts.google.com https://apis.google.com https://stempelkarte-40682.firebaseapp.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title>Bankverbindung – Stempelkarte</title>
  <meta name="theme-color" content="#EEF0F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0E1A" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/wecker-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .bkc { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; text-align: center; padding: 28px 22px; }
    .bkc-ic { font-size: 2.6rem; line-height: 1; }
    .bkc h1 { margin: 0; font-size: 1.35rem; color: var(--ink); }
    .bkc p { margin: 0; color: var(--muted); line-height: 1.45; }
    .bkc .err { color: var(--ink); background: color-mix(in srgb, var(--danger) 12%, var(--card)); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); padding: 10px 12px; border-radius: 12px; font-weight: 600; text-align: left; }
    .bkc-spin { width: 36px; height: 36px; margin: 0 auto; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--accent); animation: bkc-r 0.9s linear infinite; }
    @keyframes bkc-r { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .bkc-spin { animation: none; } }
  </style>
</head>
<body>
  <main class="card bkc" aria-live="polite">
    <div class="bkc-ic" id="ic" aria-hidden="true">🏦</div>
    <h1 id="h">Verbinde mit BAWAG …</h1>
    <div class="bkc-spin" id="spin"></div>
    <p id="msg">Einen Moment – die Freigabe wird gespeichert und die letzten 90 Tage werden geladen.</p>
    <a class="btn primary" id="back" href="./#alltag/geld" hidden>Zurück zur App</a>
  </main>
  <script type="module" src="js/bank-callback.js"></script>
</body>
</html>
