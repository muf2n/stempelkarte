# Schickt alle 15 Minuten fällige Erinnerungen der Stempelkarte per Push.
# Benötigt das Repository-Secret FIREBASE_SERVICE_ACCOUNT (siehe tools/reminders/EINRICHTUNG.md).
name: Erinnerungen

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: reminders
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten installieren
        run: npm ci --prefix tools/reminders --no-audit --no-fund || npm install --prefix tools/reminders --no-audit --no-fund
      - name: Erinnerungen senden
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/reminders/send.mjs
