# Veröffentlicht den Claude-Connector (MCP-Server, tools/mcp) als Cloudflare Worker.
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – API-Token mit der Vorlage „Edit Cloudflare Workers“
#   CLOUDFLARE_ACCOUNT_ID  – Cloudflare-Konto-ID
#   FIREBASE_SERVICE_ACCOUNT – (schon vorhanden, wie für die Erinnerungen)
#   STEMPEL_TOKEN          – langes Zufalls-Token für den Connector (siehe tools/mcp/README.md)
#   ANTHROPIC_API_KEY      – optional, nur für den In-App-Assistenten (/chat)
#   ENABLEBANKING_APP_ID   – optional, Bankverbindung (Enable Banking Application-ID)
#   ENABLEBANKING_KEY      – optional, Bankverbindung (Inhalt der .pem-Datei mit dem privaten Schlüssel)
# Ohne CLOUDFLARE_API_TOKEN wird der Lauf übersprungen (Hinweis, kein Fehler).
name: MCP-Connector veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - "tools/mcp/**"
      - "js/cal-core.js"
      - ".github/workflows/mcp-deploy.yml"
  workflow_dispatch:

concurrency:
  group: mcp-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/mcp
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Einrichtung prüfen
        id: check
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice title=MCP-Connector::CLOUDFLARE_API_TOKEN ist nicht gesetzt – Veröffentlichung übersprungen (siehe tools/mcp/README.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=MCP-Connector::CLOUDFLARE_ACCOUNT_ID fehlt – Wrangler versucht, das Konto selbst zu ermitteln."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        if: steps.check.outputs.skip != 'true'
        run: npm ci --no-audit --no-fund

      - name: Tests
        if: steps.check.outputs.skip != 'true'
        run: npm test

      - name: Worker veröffentlichen
        if: steps.check.outputs.skip != 'true'
        run: npx wrangler deploy

      - name: Worker-Secrets setzen
        if: steps.check.outputs.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          STEMPEL_TOKEN: ${{ secrets.STEMPEL_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STEMPEL_UID: ${{ secrets.STEMPEL_UID }}
          ENABLEBANKING_APP_ID: ${{ secrets.ENABLEBANKING_APP_ID }}
          ENABLEBANKING_KEY: ${{ secrets.ENABLEBANKING_KEY }}
        run: |
          # Nur gesetzte Secrets übertragen (leere würden vorhandene überschreiben). Inhalte werden nie ausgegeben.
          node -e '
            const names = ["FIREBASE_SERVICE_ACCOUNT", "STEMPEL_TOKEN", "ANTHROPIC_API_KEY", "STEMPEL_UID", "ENABLEBANKING_APP_ID", "ENABLEBANKING_KEY"];
            const out = {};
            for (const n of names) { const v = process.env[n]; if (v && v.trim()) out[n] = v; }
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/mcp-secrets.json", JSON.stringify(out), { mode: 0o600 });
            console.log("Secrets:", Object.keys(out).join(", ") || "keine");
            if (!out.STEMPEL_TOKEN) console.log("::warning title=MCP-Connector::STEMPEL_TOKEN fehlt – /mcp lehnt alle Anfragen ab.");
            if (!!out.ENABLEBANKING_APP_ID !== !!out.ENABLEBANKING_KEY) console.log("::warning title=Bankverbindung::Nur eines von ENABLEBANKING_APP_ID / ENABLEBANKING_KEY ist gesetzt – es braucht beide.");
          '
          if [ "$(cat "$RUNNER_TEMP/mcp-secrets.json")" != "{}" ]; then npx wrangler secret bulk "$RUNNER_TEMP/mcp-secrets.json"; fi
          rm -f "$RUNNER_TEMP/mcp-secrets.json"
